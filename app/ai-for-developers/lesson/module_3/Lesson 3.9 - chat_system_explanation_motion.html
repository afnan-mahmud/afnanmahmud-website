<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat System Architecture & Core Concepts · Motion Presentation</title>
    <!-- GSAP for robust timeline orchestrations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #080C14;
            --surface: #0F172A;
            --surface-hover: #1E293B;
            --surface-card: #131D31;
            --border: #334155;
            --border-light: #475569;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --text-dim: #64748B;
            --accent1: #38BDF8; /* Cyan Blue */
            --accent2: #818CF8; /* Indigo/Purple */
            --accent3: #F43F5E; /* Rose */
            --success: #34D399; /* Emerald Green */
            --warn: #FBBF24;    /* Amber */
            --error: #F87171;   /* Red */
            --server-base: #1E293B;
            --db-top: #38BDF8;
            --db-mid: #6366F1;
            --db-bot: #1E1B4B;
            --font-main: 'Inter', system-ui, sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(1000px 600px at 90% -10%, rgba(99,102,241,.15), transparent 70%),
                radial-gradient(900px 500px at 10% 110%, rgba(56,189,248,.12), transparent 70%),
                radial-gradient(500px 300px at 50% 50%, rgba(15,23,42,.6), transparent 100%);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Header / Top Bar */
        .top-bar {
            height: 66px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(14px);
            z-index: 20;
        }

        .module-label {
            font-family: var(--font-code);
            font-size: 13px;
            font-weight: 600;
            color: var(--accent1);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .scene-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .scene-counter {
            font-family: var(--font-code);
            font-size: 14px;
            color: var(--text-muted);
            background: rgba(255,255,255,0.06);
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        /* Controls / Bottom Bar */
        .bottom-bar {
            height: 72px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(14px);
            z-index: 20;
        }

        .progress-container {
            position: absolute;
            top: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent1), var(--accent2));
            box-shadow: 0 0 12px rgba(129,140,248,.65);
            transition: width 0.3s ease;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        button:hover {
            background: var(--surface-hover);
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0) scale(.97);
        }

        button:focus-visible {
            outline: 2px solid var(--accent1);
            outline-offset: 2px;
        }

        button.primary {
            background: linear-gradient(135deg, var(--accent1), #0284C7);
            color: #021224;
            border: none;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
        }

        button.primary:hover {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.55);
            background: linear-gradient(135deg, #7DD3FC, #0369A1);
        }

        kbd {
            font-family: var(--font-code);
            font-size: 11px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 2px 5px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        /* Stage Canvas Area */
        .stage-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #stage {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .stage-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 44px 44px;
            pointer-events: none;
        }

        #stage-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #stage-dom {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            perspective: 1200px;
        }

        /* ========================================================
           RICH ARCHITECTURAL UI SYSTEM (MATCHING REFERENCE DESIGN)
           ======================================================== */

        /* 1. Browser Application Window */
        .browser-window-art {
            position: absolute;
            background: #0E1626;
            border: 2px solid #38BDF8;
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 24px rgba(56,189,248,0.2);
            transform: translate(-50%, -50%);
            overflow: hidden;
            z-index: 5;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .b-bar {
            background: #172338;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .b-dots { display: flex; gap: 6px; }
        .b-dot { width: 10px; height: 10px; border-radius: 50%; }
        .b-dot.r { background: #EF4444; }
        .b-dot.y { background: #F59E0B; }
        .b-dot.g { background: #10B981; }

        .b-search {
            flex: 1;
            background: #0B111D;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-code);
            font-size: 11px;
            color: #94A3B8;
        }

        .b-search .s-icon { color: var(--accent1); }

        .b-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            background: #0A101C;
        }

        .b-wireframe-card {
            background: #131E31;
            border: 1px solid #23334D;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .b-img-thumb {
            width: 54px;
            height: 44px;
            background: linear-gradient(135deg, #1E3A8A, #0284C7);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #93C5FD;
            font-size: 18px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
        }

        .b-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .b-line {
            height: 6px;
            background: #233550;
            border-radius: 3px;
        }
        .b-line.w-full { width: 100%; }
        .b-line.w-70 { width: 70%; }
        .b-line.w-40 { width: 40%; background: var(--accent1); }

        .b-actions {
            display: flex;
            gap: 8px;
        }

        .b-btn {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-code);
        }
        .b-btn.pri { background: #38BDF8; color: #031525; }
        .b-btn.sec { background: #6366F1; color: #FFFFFF; }

        /* 2. Metallic 3-Blade Server Rack */
        .server-rack-art {
            position: absolute;
            background: #0B1320;
            border: 2px solid #4F46E5;
            border-radius: 12px;
            box-shadow: 0 20px 48px rgba(0,0,0,0.7), 0 0 28px rgba(79, 70, 229, 0.3);
            transform: translate(-50%, -50%);
            overflow: hidden;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            min-width: 170px;
        }

        .rack-blade {
            background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .blade-vents {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .blade-vent {
            width: 32px;
            height: 2px;
            background: #475569;
            border-radius: 1px;
        }

        .blade-leds {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .rack-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }
        .rack-led.cyan { color: #38BDF8; background: #38BDF8; }
        .rack-led.green { color: #34D399; background: #34D399; }
        .rack-led.purple { color: #818CF8; background: #818CF8; }
        .rack-led.blink { animation: led-blink 1.2s infinite ease-in-out; }

        @keyframes led-blink {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px currentColor); }
        }

        .rack-title-tag {
            text-align: center;
            font-size: 11px;
            font-family: var(--font-code);
            font-weight: 700;
            color: var(--accent1);
            margin-top: 4px;
        }

        /* 3. 3D Cylindrical Layered Database Disks */
        .db-cylinder-art {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 140px;
        }

        .db-stack-svg {
            filter: drop-shadow(0 16px 30px rgba(0,0,0,0.65));
        }

        .db-label-box {
            margin-top: 6px;
            font-size: 11px;
            font-family: var(--font-code);
            font-weight: 700;
            color: var(--warn);
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        /* 4. Cache / Cookie Cylinder (Center Intermediate Storage) */
        .cache-cylinder-art {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 5. Cloud Infrastructure Hub */
        .cloud-hub-art {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 6. Rotating Gear Node (Service & Sanitizer Engine) */
        .gear-node-art {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .gear-spinner-cw { animation: spin-cw 8s linear infinite; }
        .gear-spinner-ccw { animation: spin-ccw 6s linear infinite; }
        @keyframes spin-cw { 100% { transform: rotate(360deg); } }
        @keyframes spin-ccw { 100% { transform: rotate(-360deg); } }

        /* 7. Live Step-by-Step Educational HUD */
        .step-hud {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #38BDF8;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6), 0 0 20px rgba(56,189,248,0.25);
            border-radius: 12px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 20;
            backdrop-filter: blur(12px);
            max-width: 860px;
            width: 90%;
        }

        .hud-step-pill {
            background: linear-gradient(135deg, #38BDF8, #6366F1);
            color: #031525;
            font-family: var(--font-code);
            font-size: 12px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .hud-text {
            font-size: 14px;
            font-weight: 600;
            color: #F8FAFC;
            line-height: 1.5;
            flex: 1;
        }

        .hud-text span.action { color: var(--accent1); font-weight: 700; }
        .hud-text span.code { color: var(--warn); font-family: var(--font-code); font-size: 13px; }
        .hud-text span.success { color: var(--success); font-weight: 700; }

        /* Legacy fallback nodes */
        .node {
            position: absolute;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            box-shadow: 0 10px 24px rgba(0,0,0,0.45);
            color: var(--text-main);
            font-weight: 600;
            min-width: 130px;
            text-align: center;
            z-index: 3;
            transition: border-color .3s ease, box-shadow .3s ease;
        }

        .node.server { border-color: var(--accent2); box-shadow: 0 0 20px rgba(129, 140, 248, 0.25); }
        .node.client { border-color: var(--accent1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .node.db { border-color: var(--warn); box-shadow: 0 0 18px rgba(251, 191, 36, 0.2); }
        .node.router { border-color: var(--accent3); }
        .node.service { border-color: #38BDF8; }
        .node.guard { border-color: #F59E0B; background: #181308; }

        .node-icon { font-size: 28px; margin-bottom: 6px; }
        .node-label { font-size: 14px; font-weight: 700; }
        .node-sub { font-size: 11px; font-family: var(--font-code); color: var(--text-muted); margin-top: 3px; }

        /* Glowing Packets */
        .packet {
            position: absolute;
            background: var(--accent1);
            color: #04131F;
            font-family: var(--font-code);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .02em;
            padding: 6px 14px;
            border-radius: 20px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 16px var(--accent1), 0 4px 12px rgba(0,0,0,.4);
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
        }

        .packet.res { background: var(--success); box-shadow: 0 0 16px var(--success), 0 4px 12px rgba(0,0,0,.4); color: #032014; }
        .packet.err { background: var(--error); box-shadow: 0 0 16px var(--error), 0 4px 12px rgba(0,0,0,.4); color: #FFFFFF; }
        .packet.purple { background: var(--accent2); box-shadow: 0 0 16px var(--accent2); color: #FFFFFF; }
        .packet.warn { background: var(--warn); box-shadow: 0 0 16px var(--warn); color: #000000; }

        /* Glass Cards, DevTools Table, Code Blocks */
        .glass-card {
            position: absolute;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            transform: translate(-50%, -50%);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            z-index: 4;
        }

        .devtools-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-code);
            font-size: 11px;
            text-align: left;
        }

        .devtools-table th {
            color: var(--accent1);
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        .devtools-table td {
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #E2E8F0;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-code);
        }
        .badge-pill.green { background: rgba(52, 211, 153, 0.15); color: #34D399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .badge-pill.warn { background: rgba(251, 191, 36, 0.15); color: #FBBF24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .badge-pill.red { background: rgba(248, 113, 113, 0.15); color: #F87171; border: 1px solid rgba(248, 113, 113, 0.3); }
        .badge-pill.blue { background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-pill.purple { background: rgba(129, 140, 248, 0.15); color: #A5B4FC; border: 1px solid rgba(129, 140, 248, 0.3); }

        /* Intro Card v2 */
        .intro-card.v2 {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 40px;
            background:
                radial-gradient(700px 380px at 50% 8%, rgba(99,102,241,.18), transparent 70%),
                var(--surface);
            z-index: 10;
        }

        .ic-badge {
            font-family: var(--font-code);
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent1);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 14px;
            background: rgba(56,189,248,.08);
        }

        .ic-num {
            font-family: var(--font-code);
            font-weight: 700;
            font-size: 44px;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(148,163,184,.35);
            margin: 22px 0 6px;
        }

        .intro-card.v2 .intro-title {
            font-size: 44px;
            font-weight: 800;
            margin: 0 0 10px;
            line-height: 1.1;
            background: linear-gradient(90deg, var(--accent1), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ic-tag {
            font-family: var(--font-code);
            font-size: 16px;
            color: var(--accent1);
            margin-bottom: 26px;
        }

        .ic-what {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 720px;
            margin: 0 auto 22px;
        }

        .ic-use {
            max-width: 720px;
            margin: 0 auto;
            text-align: left;
            background: linear-gradient(90deg, rgba(99,102,241,.12), rgba(56,189,248,.06));
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent2);
            border-radius: 12px;
            padding: 16px 20px;
        }

        .ic-use-label {
            font-family: var(--font-code);
            font-size: 12px;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--accent2);
            margin-bottom: 7px;
            font-weight: 700;
        }

        .ic-use-text {
            font-size: 16px;
            line-height: 1.6;
            color: #CBD5E1;
        }

        .pulse-text {
            margin-top: 34px;
            font-size: 15px;
            color: var(--text-main);
            opacity: 0.7;
            animation: pulse-op 2s infinite;
        }

        .pulse-text b { color: var(--accent1); }

        @keyframes pulse-op {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Scene Overview / Jump Menu */
        #scene-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: rgba(6,9,16,.88);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }

        #scene-overlay.open { opacity: 1; pointer-events: auto; }

        .overlay-inner {
            width: min(1120px,100%);
            max-height: 86vh;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0,0,0,.6);
        }

        .overlay-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }

        .overlay-head h2 { font-size: 18px; font-weight: 800; }

        .overlay-grid {
            padding: 16px 24px 24px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(240px,1fr));
            gap: 10px;
        }

        .ov-modhead {

    <script>

        let currentSceneIndex = 0;
        let subState = 0; // 0 = Intro Card, 1 = Animation
        let masterTimeline = null;

        const DESCRIPTIONS = {
            "Client–Server Architecture": "The foundational architecture of the web. Multiple client devices (browsers and mobile apps) connect to a central server to request data and communicate.",
            "Request–Response Model": "The standard communication pattern of the internet. A client sends a request to the server, and the server processes it and returns a single response.",
            "Real-time vs Request–Response": "Unlike traditional apps that force repeated polling, real-time apps maintain an open connection so the server instantly pushes data the millisecond it arrives.",

            "Socket Rooms": "Grouping sockets into rooms to broadcast messages exclusively to room participants.",

            "Typing Indicator": "Broadcasting lightweight typing events without touching the database.",
            "mark_read / Read Receipts": "Emitting read receipt events to flip single ticks to double blue ticks.",
            "Disconnect & Cleanup": "Handling socket disconnects gracefully and freeing memory.",
            "http.createServer(app)": "Wrapping Express with core Node HTTP server so Express and Socket.io share one server instance.",
            "Why NOT app.listen()": "app.listen() hides the server instance, preventing Socket.io from attaching.",

            "One Server, Two Protocols": "A unified backend server listening on port 5000 handling both HTTP and WebSockets."
        };

        const USECASES = {
            "Client–Server Architecture": { what: "The web's base setup: many client apps (browsers, mobile apps) talk to one central server that holds the data and logic.", use: "Every buyer and seller runs a client. They all connect to one Becha-Kena server that stores the chat rooms and messages and decides who receives what." },
            "Request–Response Model": { what: "The classic one-shot pattern: the client sends a request, the server answers once, and the exchange is over.", use: "We use this for the REST parts of chat, like creating a room, loading old messages, or marking as read. Next you will see why it is not enough for live messaging." },
            "Real-time vs Request–Response": { what: "Instead of the client repeatedly asking 'any new messages?', a live connection lets the server push data the instant something happens.", use: "When a seller replies, the buyer must see it immediately without refreshing. That instant feel is exactly what our WebSocket layer delivers." },
            "HTTP vs WebSocket": { what: "HTTP does a fresh handshake for every request. WebSocket handshakes once, then keeps an open two-way channel.", use: "Loading message history uses HTTP; the live 'new_message the moment it is sent' uses WebSocket. Our chat uses both together." },
            "Full-Duplex Communication": { what: "Both sides can send at the same time over one open channel, with no waiting for turns.", use: "A buyer can be typing while the seller's message is already arriving. That simultaneous flow is what makes chat feel alive." },
            "Database Basics: Hierarchy": { what: "NoSQL stores data as Collections then Documents then Fields (folder, record, key-value).", use: "Our chat has a chatrooms collection and a messages collection; each message document has fields like roomId, senderId, and messageText." },
            "Auth vs Authz": { what: "Authentication asks 'who are you?'. Authorization asks 'are you allowed to do this?'.", use: "Logging in proves who you are, but only a room's buyer or seller is allowed to read that room's messages. That second check is authorization." },
            "JWT (JSON Web Token)": { what: "A signed token that carries a user's identity and cannot be tampered with.", use: "After login we hand the user a JWT. Every chat request and every socket connection uses it to prove which user is sending the message." },
            "Cookie": { what: "A small value stored in the browser that rides along automatically with every request.", use: "We keep the JWT in a cookie so the socket handshake can read it automatically. The user never has to manually attach a token." },
            "Middleware Pipeline": { what: "Functions that run before your main logic, acting like checkpoints on the incoming request.", use: "Before any chat controller runs, middleware checks the token and verified status, so logged-out or unverified users never reach the messaging logic." },
            "Layered Architecture": { what: "Split code into Controller (handles HTTP), Service (business logic), and Model (database).", use: "Our chat controller just passes data along; the chat service does the validation, sanitizing, and DB work. Each file stays clean and testable." },
            "Async / Await & Promises": { what: "Non-blocking code, so JavaScript keeps working while it waits for slow operations.", use: "Saving a message and fetching history hit the database, which takes time. Async keeps the server responsive to other users meanwhile." },
            "TypeScript Basics": { what: "JavaScript with types that catch mistakes in your editor before the code runs.", use: "Our schemas and services are typed (roomId is an ObjectId, messageText is a string), so wrong data shapes are caught while coding, not in production." },
            "Schema vs Model": { what: "A Schema defines the structure and rules; the Model is the tool built from it that you use to query and save.", use: "We define ChatRoom and Message schemas, then use their models to create rooms and store each chat message." },
            "ChatRoom & Message Collections": { what: "Splitting conversation metadata from the messages themselves into two separate collections.", use: "A ChatRoom links buyer, seller, and listing; each Message points back to its room. Rooms stay small and message history scales cleanly." },
            "One-to-Many Relationship": { what: "One parent record links out to many child records.", use: "One ChatRoom has many Messages. This shape lets us page through thousands of messages without bloating the room document." },
            "ObjectId": { what: "MongoDB's unique 24-character ID, with the creation timestamp baked inside it.", use: "Every room, message, user, and listing gets an ObjectId. We use them to link a message to its room and its sender." },
            "Population (ref)": { what: "Mongoose auto-fetches a linked document from another collection using a stored reference.", use: "A room only stores buyerId, sellerId, and listingId. Population turns those into the actual user names and listing title for the inbox UI." },
            "required / trim / default": { what: "Field rules: must be present, auto-remove edge spaces, and provide a fallback value.", use: "messageText is required and trimmed (no blank or space-only messages), and readStatus defaults to false so every new message starts unread." },
            "timestamps": { what: "Automatic createdAt and updatedAt on every document.", use: "We sort chat messages by createdAt and show 'sent at' times, with no manual timestamping needed." },
            "Database Index": { what: "A sorted roadmap so the database jumps straight to matches instead of scanning everything.", use: "Without an index, loading a busy room's history scans every message. An index makes it instant even with millions of messages." },
            "Compound Index": { what: "One index built from several fields together.", use: "We index buyerId, sellerId, and listingId together, so finding 'the room between these two people about this listing' is a single fast lookup." },
            "Unique Index": { what: "A database-level rule that blocks duplicate values.", use: "A unique compound index guarantees only ONE room exists per buyer, seller, and listing, so we never create duplicate chats for the same deal." },
            "Index Direction (-1)": { what: "Storing an index in descending order for reverse-chronological reads.", use: "Chat shows newest messages first. A createdAt: -1 index lets the database return them already in that order." },
            "Sanitize Input": { what: "The golden rule: never trust user input; clean it before saving.", use: "Buyers and sellers can type anything. We sanitize every message so scams, scripts, and junk never reach the database or the other person." },
            "Regex Basics": { what: "Pattern rules for finding specific structures inside text.", use: "We use regex to spot phone numbers, links, and banned phrases hidden inside chat messages." },
            "External Link Detection": { what: "Catching http, www, and .com style patterns inside text.", use: "Scammers try to pull users off-platform with links. We detect and strip them so the conversation stays inside Becha-Kena." },
            "Phone Number Masking": { what: "Replacing digit sequences that look like phone numbers with asterisks.", use: "To protect privacy and keep deals on-platform, a buyer's 01712... becomes [phone hidden] before the seller sees it." },
            "Keyword Detection": { what: "Flagging specific risky phrases in a message.", use: "Phrases like 'advance payment' or 'send money first' trigger an automatic scam warning in the chat, protecting users from fraud." },
            "HTML Tag Stripping (XSS)": { what: "Removing HTML and script tags so text can never execute as code.", use: "If someone types a script tag into chat, we strip it so it shows as harmless text instead of attacking the recipient's browser." },
            "Structured Return": { what: "Returning an object with clean text plus any warnings, not just a raw string.", use: "Our sanitizer returns sanitizedText plus warnings, so the socket can deliver the clean message AND privately warn the sender." },
            "Service Layer Separation": { what: "Keep controllers thin; put the real work inside the service.", use: "The chat service holds all the sanitizing, validation, and DB logic. The controller just calls it and returns the result." },
            "Validation": { what: "Checking business rules before you act.", use: "Before opening a room we confirm the listing exists and is still active. You cannot start a chat about a deleted or sold item." },
            "Business Rule: buyer ≠ seller": { what: "A logic guard that prevents invalid states.", use: "We block a user from opening a chat with themselves; a seller cannot message their own listing." },
            "upsert (Find or Create)": { what: "One atomic operation that returns the existing record, or creates it if it is missing.", use: "'Message seller' upserts on buyer, seller, and listing: reuse the existing room if there is one, otherwise create it. Never a duplicate." },
            "$or Operator": { what: "Matches documents that meet any one of several conditions.", use: "To load a user's inbox we fetch every room where they are the buyer OR the seller, in one query." },
            "Last Message Preview + Unread Count": { what: "Summary data prepared for each row of an inbox list.", use: "Each inbox row shows the other person, a preview of the latest message, and how many messages are still unread, all from aggregated data." },
            "Authorization Check → 403": { what: "Blocking access to resources the user does not own.", use: "If someone requests a room they are not part of, we throw 403 Forbidden. You can only read your own conversations." },
            "Pagination (page / limit / skip)": { what: "Loading data in small chunks instead of all at once.", use: "A long chat can have thousands of messages. We load them page by page so the app stays fast and never crashes the client." },
            "Mark as Read (updateMany)": { what: "A single bulk update across many documents at once.", use: "When a user opens a room, one command marks all messages sent to them as read, powering the 'seen' state." },
            "Empty Message Block → 400": { what: "Rejecting requests that end up empty or invalid after processing.", use: "If sanitizing strips a message down to nothing (it was only a link or script), we reject it with 400 instead of saving a blank message." },
            "AppError (Custom Error Class)": { what: "A structured error that carries a status code and a clear message.", use: "Instead of leaking raw crashes, our chat throws AppErrors (403, 400, and so on) that a global handler turns into clean responses." },
            "Controller Pattern": { what: "Extract the inputs, call the service, then send the response.", use: "The chat controller pulls the roomId and user, asks the service to do the work, and returns the right status and data." },
            "HTTP Status Codes": { what: "Standard numeric outcomes: 200 ok, 400 bad input, 403 forbidden, and more.", use: "Our chat endpoints speak this language so the frontend knows if a send succeeded, was blocked, or was unauthorized." },
            "authenticate & requireVerified Middleware": { what: "Chained guards: first logged-in, then verified.", use: "Every chat route runs both, so only verified, logged-in users can create rooms or send messages." },
            "Route Params vs Query Params": { what: "Path params identify a resource; query params filter or modify it.", use: "/rooms/:roomId/messages identifies which room, while ?page=2&limit=20 controls how much history to load." },
            "Router Mounting & API Versioning": { what: "Grouping routes into files that mount under a version prefix.", use: "Chat routes mount at /api/v1/chat, keeping them organized and safe to upgrade later without breaking existing clients." },
            "Socket.io vs WebSockets": { what: "WebSocket is the raw pipe; Socket.io adds rooms, reconnection, and fallbacks on top.", use: "We build on Socket.io so our chat gets rooms and auto-reconnect out of the box instead of hand-rolling them." },
            "Namespace (/chat)": { what: "A named channel that isolates traffic on a single server.", use: "All chat traffic lives in the /chat namespace, kept separate from things like notifications or live tracking." },
            "Socket Handshake Authentication": { what: "Verifying identity during the socket's initial connection.", use: "Sockets skip normal HTTP routes, so on connect we read the cookie, verify the JWT, and reject anyone who is not a valid user." },
            "tokenVersion Check": { what: "A database counter that invalidates old tokens after logout.", use: "If a user logs out, their old token cannot reconnect to chat. We compare tokenVersion on every socket connection." },
            "Socket Rooms": { what: "Grouping sockets so a message can target just that group.", use: "Each conversation is a socket room. A new message is emitted only to that room, so just the two participants receive it." },
            "Emit vs Broadcast vs To": { what: "Three delivery modes: to yourself, to everyone except the sender, or to a specific room.", use: "We use to(room).emit so a message reaches the room's members, and emit private warnings back to just the sender." },
            "join_room Event": { what: "The client asks to enter a room; the server verifies and adds them.", use: "When a user opens a chat they emit join_room. We check they belong there, add their socket, and confirm with room_joined." },
            "send_message Flow": { what: "The full path of a live message, end to end.", use: "Client emits text, server sanitizes it, saves to the DB, then emits the clean new_message to the room plus a warning to the sender, all in milliseconds." },
            "Typing Indicator": { what: "Broadcasting lightweight typing events without touching the database.", use: "As someone types, we broadcast user_typing to the other person so they see 'typing...', with no database write needed." },
            "mark_read / Read Receipts": { what: "Emitting a read event so the sender sees a 'seen' state.", use: "When a user reads messages, we update the DB and emit messages_read, flipping the sender's single tick into double ticks." },
            "Disconnect & Cleanup": { what: "Handling a dropped connection gracefully.", use: "When a user closes the app or loses signal, the socket disconnects. We remove them from rooms and free the connection." },
            "http.createServer(app)": { what: "Manually creating the underlying Node HTTP server around Express.", use: "Express alone cannot share its server with Socket.io. Wrapping it lets our REST API and chat sockets run on the same server." },
            "Why NOT app.listen()": { what: "app.listen() hides the server so nothing else can attach to it.", use: "We use http.createServer(app) instead, so Socket.io has a real server instance to plug the chat into. This is the number one gotcha students hit." },
            "Socket.io Init + CORS": { what: "Starting Socket.io on the server with cross-origin rules configured.", use: "We initialize Socket.io on our HTTP server and set CORS so the browser's chat client is allowed to complete the handshake." },
            "One Server, Two Protocols": { what: "A single server on a single port handling both HTTP and WebSocket.", use: "The finished Becha-Kena backend serves the REST API and the live chat from one port. The whole architecture comes together." }
        };

        // ==========================================
        // ADVANCED UI BUILDER ENGINE
        // ==========================================

            clear: () => {
                DOM.svg.innerHTML = `
                    <defs>
                        <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
                        </marker>
                        <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 8 5 L 0 9 z" fill="#818CF8" />
                        </marker>

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                let d = '';
                if (type === 'horizontal-first') {
                    d = `M ${x1} ${y1} L ${x2} ${y1} L ${x2} ${y2}`;
                } else if (type === 'vertical-first') {
                    d = `M ${x1} ${y1} L ${x1} ${y2} L ${x2} ${y2}`;
                } else {
                    d = `M ${x1} ${y1} L ${x2} ${y2}`;
                }
                
                path.setAttribute('d', d);
                path.setAttribute('stroke', color);
                path.setAttribute('stroke-width', '2.5');
                path.setAttribute('fill', 'none');
                if (arrow) path.setAttribute('marker-end', `url(#${arrow})`);

                    const bad = UI.card('❌ app.listen(5000)', `
                        <div style="color:var(--error); font-weight:700;">Hides the HTTP Server instance!</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">
                            Socket.io cannot attach to it ➔ WebSockets fail!
                        </div>
                    `, 25, 50, 260);

                    const good = UI.card('✓ http.createServer(app)', `
                        <div style="color:var(--success); font-weight:700;">Gives full server control!</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">
                            Both Express & Socket.io attach to same port 5000.
                        </div>
                    `, 75, 50, 280);
                    const hud = UI.stepHUD(1, 2, "app.listen() creates a hidden HTTP server; http.createServer(app) gives you full access.");

                    tl.from([bad, good, '.step-hud'], { opacity: 0, y: 20, stagger: 0.2 })
                      .add(ANIM.pulse(tl, good, '#34D399'));
                }
            },

            // 61. Socket.io Init + CORS
            {
                mod: "MODULE 6 · Server Integration", title: "Socket.io Init + CORS", sub: "Cross-Origin cookie sharing configuration",
                build: (tl) => {
                    const card = UI.card('Socket.io Server Configuration', `
                        <div style="font-family:var(--font-code); font-size:12px; line-height:1.6;">
                            const io = new Server(httpServer, {<br>
                            &nbsp;&nbsp;cors: {<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;origin: ["http://localhost:3000", "https://bechakena.com"],<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;<span style="color:var(--success); font-weight:700;">credentials: true</span> <span style="color:var(--text-muted);">// Allows cookie sharing</span><br>
                            &nbsp;&nbsp;}<br>
                            });
                        </div>
                    `, 50, 50, 560);
                    const hud = UI.stepHUD(1, 1, "credentials: true is mandatory to allow browser cookies to travel during the socket handshake.");

                    tl.from([card, '.step-hud'], { scale: 0.85, opacity: 0, duration: 0.4 })
                      .add(ANIM.pulse(tl, card, '#38BDF8'));
                }
            },

            // 62. One Server, Two Protocols (THE GRAND FINALE)
            {
                mod: "MODULE 6 · Server Integration", title: "One Server, Two Protocols", sub: "The Grand Finale Architecture",
                build: (tl) => {
                    const s = UI.serverRack('s', { x: 50, y: 50, width: 220, label: 'Server :5000', sub: 'http.createServer(app)' });
                    const c1 = UI.browser('c1', { x: 15, y: 28, width: 200, url: 'rest-client.com', title: 'REST API Traffic' });
                    const c2 = UI.browser('c2', { x: 15, y: 72, width: 200, url: 'socket-client.com', title: 'WebSocket Stream' });
                    const db = UI.database3D('db', { x: 85, y: 50, label: 'MongoDB Atlas', sub: 'Single Source of Truth' });
                    const hud = UI.stepHUD(1, 3, "A single unified Node.js server on port 5000 simultaneously handling HTTP REST and WebSockets!");

                    UI.line(25, 28, 39, 50, '#38BDF8', false, 'arrow-cyan');
                    UI.line(25, 72, 39, 50, '#818CF8', false, 'arrow-purple');
                    UI.line(61, 50, 76, 50, '#FBBF24', false, 'arrow-warn');

                    const pRest = UI.packet('HTTP GET /listings');
                    const pWs = UI.packet('WS emit("send_message")', 'purple');

                    tl.from(['.server-rack-art', '.browser-window-art', '.db-cylinder-art', '.step-hud'], { opacity: 0, stagger: 0.08 })
                      .add(ANIM.send(tl, pRest, 25, 28, 50, 50, 0.6))
                      .add(ANIM.send(tl, pWs, 25, 72, 50, 50, 0.6), "<0.2")
                      .add(ANIM.pulse(tl, s, '#34D399'))
                      .add(ANIM.send(tl, UI.packet('Database sync', 'warn'), 50, 50, 85, 50, 0.5))
                      .add(ANIM.pulse(tl, db, '#FBBF24'));
                }
            }
        ];

        // Ensure exact order mapping
        const exactOrder = [
            "Client–Server Architecture",
            "Request–Response Model",
            "Real-time vs Request–Response",
            "HTTP vs WebSocket",
            "Full-Duplex Communication",
            "Database Basics: Hierarchy",
            "Auth vs Authz",
            "JWT (JSON Web Token)",
            "Cookie",
            "Middleware Pipeline",
            "Layered Architecture",
            "Async / Await & Promises",
            "TypeScript Basics",
            "Schema vs Model",
            "ChatRoom & Message Collections",
            "One-to-Many Relationship",
            "ObjectId",
            "Population (ref)",
            "required / trim / default",
            "timestamps",
            "Database Index",
            "Compound Index",
            "Unique Index",
            "Index Direction (-1)",
            "Sanitize Input",
            "Regex Basics",
            "External Link Detection",
            "Phone Number Masking",
            "Keyword Detection",
            "HTML Tag Stripping (XSS)",
            "Structured Return",
            "Service Layer Separation",
            "Validation",
            "Business Rule: buyer ≠ seller",
            "upsert (Find or Create)",
            "$or Operator",
            "Last Message Preview + Unread Count",
            "Authorization Check → 403",
            "Pagination (page / limit / skip)",
            "Mark as Read (updateMany)",
            "Empty Message Block → 400",
            "AppError (Custom Error Class)",
            "Controller Pattern",
            "HTTP Status Codes",
            "authenticate & requireVerified Middleware",
            "Route Params vs Query Params",
            "Router Mounting & API Versioning",
            "Socket.io vs WebSockets",
            "Namespace (/chat)",
            "Socket Handshake Authentication",
            "tokenVersion Check",
            "Socket Rooms",
            "Emit vs Broadcast vs To",
            "join_room Event",
            "send_message Flow",
            "Typing Indicator",
            "mark_read / Read Receipts",
            "Disconnect & Cleanup",
            "http.createServer(app)",
            "Why NOT app.listen()",
            "Socket.io Init + CORS",
            "One Server, Two Protocols"
        ];
        
        scenes.sort((a, b) => {
            const idxA = exactOrder.indexOf(a.title);
            const idxB = exactOrder.indexOf(b.title);
            return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
        });

        function renderSceneState() {
            if (masterTimeline) masterTimeline.kill();
            UI.clear();
            gsap.set([DOM.dom, DOM.svg], { opacity: 0 });
            
            const scene = scenes[currentSceneIndex];
            DOM.module.innerText = scene.mod;
            
            if (subState === 0) {
                DOM.title.innerText = "INTRODUCTION";
            } else {
                DOM.title.innerText = scene.title;
            }
            
            DOM.counter.innerText = `${String(currentSceneIndex + 1).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')}`;
            
            const progressPct = ((currentSceneIndex + (subState === 1 ? 1 : 0.5)) / scenes.length) * 100;
            DOM.progress.style.width = `${progressPct}%`;

            if (subState === 0) {
                // Intro Card State
                DOM.pauseBtn.style.display = 'none';
                DOM.replayBtn.style.display = 'none';
                
                const uc = USECASES[scene.title] || { what: (DESCRIPTIONS[scene.title] || "Core concept for building the chat system."), use: "" };
                const nStr = String(currentSceneIndex + 1).padStart(2, '0');
                const card = UI.create('div', 'intro-card v2', DOM.dom);
                
                card.innerHTML = `
                    <div class="ic-badge">${scene.mod}</div>
                    <div class="ic-num">${nStr}</div>
                    <div class="intro-title">${scene.title}</div>
                    <div class="ic-tag">${scene.sub}</div>
                    <div class="ic-what">${uc.what}</div>
                    ${uc.use ? `<div class="ic-use"><div class="ic-use-label">◆ In the Becha-Kena chat build</div><div class="ic-use-text">${uc.use}</div></div>` : ``}
                    <div class="pulse-text">Press <b>→</b> / Space to play the animation</div>
                `;
                
                gsap.from(card, { opacity: 0, y: 24, duration: 0.6, ease: "power2.out" });
                gsap.from(card.querySelectorAll('.ic-badge, .ic-num, .intro-title, .ic-tag, .ic-what, .ic-use, .pulse-text'),
                          { opacity: 0, y: 16, stagger: 0.07, duration: 0.5, ease: "power2.out", delay: 0.12 });
                
            } else {
                // Animation State
                DOM.pauseBtn.style.display = 'flex';
                DOM.pauseBtn.innerHTML = '⏸ Pause <kbd>P</kbd>';
                DOM.replayBtn.style.display = 'flex';

                masterTimeline = gsap.timeline({ defaults: { ease: "power2.out" } });
                scene.build(masterTimeline);
                masterTimeline.timeScale(animSpeed);
            }

            gsap.to([DOM.dom, DOM.svg], { opacity: 1, duration: 0.3, ease: "power2.out" });
        }

        function togglePause() {
            if (subState !== 1 || !masterTimeline) return;
            
            if (masterTimeline.paused()) {
                masterTimeline.play();
                DOM.pauseBtn.innerHTML = '⏸ Pause <kbd>P</kbd>';
            } else {
                masterTimeline.pause();
                DOM.pauseBtn.innerHTML = '▶ Play <kbd>P</kbd>';
            }
        }

        function nextAction() {
            if (subState === 0) {
                subState = 1;
                renderSceneState();
            } else {
                if (currentSceneIndex < scenes.length - 1) {
                    currentSceneIndex++;
                    subState = 0;
                    renderSceneState();
                }
            }
        }

        function prevAction() {
            if (subState === 1) {
                subState = 0;
                renderSceneState();
            } else {
                if (currentSceneIndex > 0) {
                    currentSceneIndex--;
                    subState = 1;
                    renderSceneState();
                }
            }
        }

        function replayAction() {
            if (subState === 1) {
                renderSceneState();
            }
        }

        // Event Listeners
        document.getElementById('btn-next').addEventListener('click', nextAction);
        document.getElementById('btn-prev').addEventListener('click', prevAction);
        document.getElementById('btn-replay').addEventListener('click', replayAction);
        document.getElementById('btn-pause').addEventListener('click', togglePause);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextAction();
            } else if (e.key === 'ArrowLeft') {
                prevAction();
            } else if (e.key.toLowerCase() === 'r') {
                replayAction();
            } else if (e.key.toLowerCase() === 'p') {
                togglePause();
            }
        });

        // Animation speed control
        let animSpeed = 1;
        const SPEEDS = [1, 1.5, 2, 0.5];
        let speedIdx = 0;
        function cycleSpeed() {
            speedIdx = (speedIdx + 1) % SPEEDS.length;
            animSpeed = SPEEDS[speedIdx];
            document.getElementById('btn-speed').innerHTML = `⚡ ${animSpeed}× <kbd>S</kbd>`;
            if (masterTimeline && subState === 1) masterTimeline.timeScale(animSpeed);
        }
        document.getElementById('btn-speed').addEventListener('click', cycleSpeed);

        // Scene overview / jump menu
        const overlay = document.createElement('div');
        overlay.id = 'scene-overlay';
        overlay.innerHTML = `
            <div class="overlay-inner">
                <div class="overlay-head">
                    <h2>All 62 Scenes · Jump to any topic</h2>
                    <button id="ov-close">✕ Close <kbd>Esc</kbd></button>
                </div>
                <div class="overlay-grid" id="ov-grid"></div>
            </div>`;
        document.body.appendChild(overlay);

        function buildOverview() {
            const grid = document.getElementById('ov-grid');
            grid.innerHTML = '';
            let lastMod = null;
            scenes.forEach((s, i) => {
                if (s.mod !== lastMod) {
                    const h = document.createElement('div');
                    h.className = 'ov-modhead';
                    h.textContent = s.mod;
                    grid.appendChild(h);
                    lastMod = s.mod;
                }
                const item = document.createElement('button');
                item.className = 'ov-item' + (i === currentSceneIndex ? ' active' : '');
                item.innerHTML = `<span class="ov-num">${String(i + 1).padStart(2, '0')}</span><span class="ov-title">${s.title}</span>`;
                item.addEventListener('click', () => {
                    currentSceneIndex = i;
                    subState = 0;
                    closeOverview();
                    renderSceneState();
                });
                grid.appendChild(item);
            });
        }
        function openOverview() { buildOverview(); overlay.classList.add('open'); }
        function closeOverview() { overlay.classList.remove('open'); }
        function toggleOverview() { overlay.classList.contains('open') ? closeOverview() : openOverview(); }
        document.getElementById('btn-menu').addEventListener('click', toggleOverview);
        document.getElementById('ov-close').addEventListener('click', closeOverview);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverview(); });

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'o') { toggleOverview(); }
            else if (e.key === 'Escape') { closeOverview(); }
            else if (k === 's') { cycleSpeed(); }
        });

        // Initialize first scene at State 0 (Intro Card)
        renderSceneState();

        // Handle resize
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(() => {
                if(subState === 1) replayAction();
            }, 200);
        });

    </script>
</body>
</html>
